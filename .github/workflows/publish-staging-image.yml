name: Publish Krawana staging image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or full commit SHA to build
        required: true
        default: krawana

permissions:
  contents: read
  packages: write

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve image metadata
        id: metadata
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/intex32/valhalla-web-app:${revision}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          build-args: |
            SOURCE_REVISION=${{ steps.metadata.outputs.revision }}
            VITE_VALHALLA_URL=https://valhalla-staging.heimann.dev
            VITE_CLIENT_ID=krawana-staging-web-app
            VITE_DEFAULT_COSTING_MODEL=emergency
          cache-from: type=gha,scope=valhalla-web-app-amd64
          cache-to: type=gha,mode=max,scope=valhalla-web-app-amd64

      - name: Verify image
        env:
          EXPECTED_REVISION: ${{ steps.metadata.outputs.revision }}
          IMAGE: ghcr.io/intex32/valhalla-web-app@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          docker pull "$IMAGE"

          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")"
          test "$platform" = "linux/amd64"

          revision="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE")"
          test "$revision" = "$EXPECTED_REVISION"

          valhalla_url="$(docker image inspect \
            --format '{{ index .Config.Labels "dev.heimann.valhalla-url" }}' \
            "$IMAGE")"
          test "$valhalla_url" = "https://valhalla-staging.heimann.dev"

          client_id="$(docker image inspect \
            --format '{{ index .Config.Labels "dev.heimann.client-id" }}' \
            "$IMAGE")"
          test "$client_id" = "krawana-staging-web-app"

          docker run --rm --entrypoint grep "$IMAGE" \
            -RFl https://valhalla-staging.heimann.dev /usr/share/nginx/html
          docker run --rm --entrypoint grep "$IMAGE" \
            -RFl krawana-staging-web-app /usr/share/nginx/html

          docker run --detach --rm --name valhalla-ui-smoke \
            --publish 127.0.0.1:18080:80 "$IMAGE"
          trap 'docker stop valhalla-ui-smoke' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/directions \
            | grep -F '<div id="valhalla-app-root"></div>'

      - name: Record published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          REVISION: ${{ steps.metadata.outputs.revision }}
        shell: bash
        run: |
          {
            echo "### Published Krawana Valhalla UI image"
            echo
            echo "- Source revision: \`$REVISION\`"
            echo "- Image tag: \`$IMAGE\`"
            echo "- Deployment reference: \`ghcr.io/intex32/valhalla-web-app@$DIGEST\`"
            echo "- Valhalla URL: \`https://valhalla-staging.heimann.dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
